name: build-and-publish

# 触发：推送 master 分支、手动触发，或推送 v* 版本标签时构建；打 tag 才发布 NuGet 包
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # 允许 GitHub 为本 job 颁发 OIDC 令牌（NuGet 受信任发布用，无需 API key）

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build -c Release src/ILSpyMcp/ILSpyMcp.csproj

      - name: Test
        run: dotnet test tests/ILSpyMcp.Tests/ILSpyMcp.Tests.csproj -c Release --no-build

      # Client 端到端运行期依赖，server 用 `ilspycmd` 命令名从 PATH 解析。
      - name: Install ilspycmd (global tool)
        shell: pwsh
        run: dotnet tool install --global ilspycmd

      # 走全部 5 个工具 + 工具列表断言 + decompile_to_dir 产物断言；
      # 任何场景失败时 Client 以非零退出码结束，使本 job 失败。
      - name: End-to-end (Client)
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          dotnet run -c Release --project src/ILSpyMcp.Client/ILSpyMcp.Client.csproj

      # 仅版本标签（v*）时打包并发布到 NuGet（框架依赖，无需 -r）。
      # PackageReleaseNotes 从 CHANGELOG.md 提取当前 tag 对应段落（## [<version>]），缺失则构建失败，防止静默无说明发布。
      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/v', ''
          $changelog = Get-Content -Raw 'CHANGELOG.md'
          $marker = "## [$tag]"
          $idx = $changelog.IndexOf($marker)
          if ($idx -lt 0) { throw "CHANGELOG.md 缺少段落 $marker，请先为 $tag 记录变更说明" }
          $notes = $changelog.Substring($idx + $marker.Length)
          $next = $notes.IndexOf("`n## ")
          if ($next -ge 0) { $notes = $notes.Substring(0, $next) }
          $notes = $notes.Trim()
          dotnet pack src/ILSpyMcp/ILSpyMcp.csproj -c Release --no-build -o artifacts "-p:PackageReleaseNotes=$notes"

      # OIDC 交换出短期 NuGet API 密钥（有效期 1 小时，勿提前获取）
      - name: NuGet login (OIDC -> temp API key)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: NuGet/login@v1
        id: login
        with:
          user: Silver # nuget.org 用户名（profile name，非邮箱）

      - name: NuGet push
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem artifacts/*.nupkg | Select-Object -First 1
          dotnet nuget push $nupkg.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
