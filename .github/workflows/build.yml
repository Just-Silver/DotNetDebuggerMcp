name: build-and-publish

# 触发：推送 master 分支、手动触发，或推送 v* 版本标签时构建；打 tag 才发布 NuGet 包并创建 GitHub Release
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

# 宿主测试套件内 UiTools / AppServices 两个集合标了 DisableParallelization（进程内互斥、不与其他集合并行），
# 单 job 串行跑约 10 分钟。这里按集合拆到并行 job（各占独立 runner），墙钟取决于最长分片。
jobs:
  test-host-ui:
    # UI 自动化（UiTools 集合：DebugUiToolsTests + DebugVerifyToolTests）：真实桌面 UIA 驱动，独占桌面
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Generate test data
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tests/TestData/generate-testdata.ps1
      - name: Test (UI)
        run: dotnet test --project tests/DotNetDebuggerMcp.Tests/DotNetDebuggerMcp.Tests.csproj -c Release -- --filter-class "DotNetDebuggerMcp.Tests.DebugUiToolsTests" --filter-class "DotNetDebuggerMcp.Tests.DebugVerifyToolTests"

  test-host-debug:
    # 动态调试端到端（真实 launch/attach 目标进程；单活动调试会话）——独立 runner，不与 UI 分片抢桌面
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Generate test data
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tests/TestData/generate-testdata.ps1
      - name: Test (debug)
        run: dotnet test --project tests/DotNetDebuggerMcp.Tests/DotNetDebuggerMcp.Tests.csproj -c Release -- --filter-class "DotNetDebuggerMcp.Tests.DebugMcpToolsTests" --filter-class "DotNetDebuggerMcp.Tests.DebugVariablesNamesWhitelistTests"

  test-host-core:
    # 其余宿主测试（含 AppServices 集合与纯逻辑用例）。--filter-not-class 兜底：新增测试类默认落本分片
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Generate test data
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tests/TestData/generate-testdata.ps1
      - name: Test (core)
        run: dotnet test --project tests/DotNetDebuggerMcp.Tests/DotNetDebuggerMcp.Tests.csproj -c Release -- --filter-not-class "DotNetDebuggerMcp.Tests.DebugUiToolsTests" --filter-not-class "DotNetDebuggerMcp.Tests.DebugVerifyToolTests" --filter-not-class "DotNetDebuggerMcp.Tests.DebugMcpToolsTests" --filter-not-class "DotNetDebuggerMcp.Tests.DebugVariablesNamesWhitelistTests"

  test-lib:
    # 库级测试（反编译/文档服务；含「反编译后不残留依赖程序集句柄」回归护栏 AssemblyFileHandleTests）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Generate test data
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tests/TestData/generate-testdata.ps1
      - name: Test (Decompiler)
        run: dotnet test --project tests/DotNetDebugger.Decompiler.Tests/DotNetDebugger.Decompiler.Tests.csproj -c Release

  release:
    # 仅版本标签（v*）时打包并发布；需全部分片测试通过
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-host-ui, test-host-debug, test-host-core, test-lib]
    runs-on: windows-latest
    permissions:
      contents: write # 创建 GitHub Release 并上传 nupkg 资产
      id-token: write # 允许 GitHub 为本 job 颁发 OIDC 令牌（NuGet 受信任发布用，无需 API key）
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build -c Release src/DotNetDebuggerMcp/DotNetDebuggerMcp.csproj

      # 从 CHANGELOG.md 提取当前 tag 对应段落（## [<version>]）作为 GitHub Release 正文写入 release-body.md
      # （缺失则构建失败，防止静默无说明发布）；NuGet 包本身不再内嵌日志，PackageReleaseNotes 改为指向 GitHub Release 页链接。
      - name: Extract release notes
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/v', ''
          $changelog = Get-Content -Raw 'CHANGELOG.md'
          $marker = "## [$tag]"
          $idx = $changelog.IndexOf($marker)
          if ($idx -lt 0) { throw "CHANGELOG.md 缺少段落 $marker，请先为 $tag 记录变更说明" }
          $notes = $changelog.Substring($idx + $marker.Length)
          $next = $notes.IndexOf("`n## ")
          if ($next -ge 0) { $notes = $notes.Substring(0, $next) }
          $notes = $notes.Trim()
          Set-Content -Path 'release-body.md' -Value $notes -Encoding utf8

      # 框架依赖打包，无需 -r。
      - name: Pack
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/v', ''
          dotnet pack src/DotNetDebuggerMcp/DotNetDebuggerMcp.csproj -c Release --no-build -o artifacts "-p:PackageReleaseNotes=https://github.com/Just-Silver/DotNetDebuggerMcp/releases/tag/v$tag"

      # OIDC 交换出短期 NuGet API 密钥（有效期 1 小时，勿提前获取）
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: Silver # nuget.org 用户名（profile name，非邮箱）

      - name: NuGet push
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem artifacts/*.nupkg | Select-Object -First 1
          dotnet nuget push $nupkg.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      # NuGet 发布成功后创建 GitHub Release：正文复用 CHANGELOG 当前版本段，资产携带 nupkg，正式版（不标记 prerelease）
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-body.md
          files: artifacts/*.nupkg
